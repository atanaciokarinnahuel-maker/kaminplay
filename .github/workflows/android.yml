name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: the APK builds, but Google sign-in is disabled."
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaminplay.jks"
            echo "KAMIN_KEYSTORE_FILE=$RUNNER_TEMP/kaminplay.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set: the APK is signed with a throwaway debug key, so Google sign-in will reject it."
          fi

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        env:
          KAMIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KAMIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KAMIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kaminplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
